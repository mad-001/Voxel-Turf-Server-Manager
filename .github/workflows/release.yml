# Packages VoxelTurf-Takaro-Server-Manager-v<VERSION>.zip (winmm.dll + mods/TakaroConnector/)
# on every push to main. Creates a GitHub release (tag = "v" + VERSION) only when that
# tag does not exist yet. To ship a release: bump VERSION in your PR and merge it.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: |
          v=$(tr -d '[:space:]' < VERSION | sed 's/^[vV]//')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package zip
        run: |
          mkdir -p stage/mods release
          cp winmm.dll stage/
          cp -r mod stage/mods/TakaroConnector
          (cd stage && zip -qr "../release/VoxelTurf-Takaro-Server-Manager-${{ steps.ver.outputs.tag }}.zip" .)
          unzip -l release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Create release ${{ needs.build.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            --title "${{ needs.build.outputs.tag }}" \
            --generate-notes \
            release/*
